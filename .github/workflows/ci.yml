name: CI

on:
  push:
    branches: ["main", "master", "alpha/**"]
  pull_request:

jobs:
  backend:
    name: Backend tests and honesty gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Honesty gate (no unverifiable UI claims)
        run: python scripts/check_ui_claims.py
      - name: Tests
        run: python -m pytest -q
      - name: Detection accuracy on the golden dataset
        run: python scripts/evaluate.py

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
